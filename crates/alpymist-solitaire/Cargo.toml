[package]
name = "alpymist-solitaire"
description = "Alpymist's Solitaire: Klondike in a window, drawn with Denise in the theme's colours."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "alpymist-solitaire"
path = "src/main.rs"
required-features = ["window"]

[features]
default = ["window"]
# The desktop's window. Without it this is the game alone, for
# alpymist-solitaire-console to show on a screen with no desktop.
window = ["alpymist-widget/wayland"]

[dependencies]
# The fonts, the controls and the menu's appearance; with `window`, the
# window too. By its path and not from the workspace, to leave its Wayland
# host out when this is built without one.
alpymist-widget = { path = "../alpymist-widget", default-features = false }
denise = { workspace = true }
denise-render = { workspace = true }
denise-text = { workspace = true }
# The cards' faces are PNGs in the program: cards/README.md.
png = { workspace = true }

[lints]
workspace = true
