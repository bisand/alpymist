[package]
name = "alpymist-wifi"
description = "Alpymist's Wi-Fi manager: iwd over D-Bus, a popup under the bar drawn with Denise, and the bar's status."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["popup"]
# The popup and its drawing. Without it the crate is iwd, the model and the
# bar's line — what the installer uses, with no Wayland or fonts behind it.
popup = [
    "dep:alpymist-menu",
    "dep:denise",
    "dep:denise-render",
    "dep:denise-text",
    "dep:bytemuck",
    "dep:smithay-client-toolkit",
]

[[bin]]
name = "alpymist-wifi"
path = "src/main.rs"
required-features = ["popup"]

[[example]]
name = "snapshot"
required-features = ["popup"]

[dependencies]
# The popup wears the menu's appearance and draws text through its lazy font
# source, so the two look like one thing and a theme set for one reaches both.
alpymist-menu = { path = "../alpymist-menu", optional = true }
denise = { workspace = true, optional = true }
denise-render = { workspace = true, optional = true }
denise-text = { workspace = true, optional = true }
serde_json = { workspace = true }
# iwd is spoken to over the system bus: structured answers, change signals,
# and an agent for passphrases, none of which iwctl's tables give.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# The address is not on iwd's bus; it is read from the interface.
nix = { version = "0.29", default-features = false, features = ["net"] }

# The same host as the menu's: a wlr layer surface over wl_shm.
[target.'cfg(target_os = "linux")'.dependencies]
bytemuck = { version = "1", optional = true }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"], optional = true }

[dev-dependencies]
png = "0.17"

[lints]
workspace = true
