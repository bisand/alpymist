[package]
name = "alpymist-lock"
description = "The Alpymist lock screen: the login screen again, on an ext-session-lock-v1 surface, with PAM behind it instead of greetd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "alpymist_lock"
path = "src/lib.rs"

[[bin]]
name = "alpymist-lock"
path = "src/main.rs"

[dependencies]
# The screen itself. The lock is the login screen with a different thing
# behind it, so it is that code, not a copy of it.
alpymist-greeter = { workspace = true, default-features = false }
denise = { workspace = true }
denise-render = { workspace = true }

# The session lock and the password check are both Linux's. Without them the
# crate is the account lookup and the snapshot, which build anywhere.
[target.'cfg(target_os = "linux")'.dependencies]
bytemuck = "1"
# PAM, safely: nonstick is a safe wrapper over libpam with no bindgen in the
# build, so the builder needs linux-pam-dev and nothing else.
nonstick = "0.1.2"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }

[dev-dependencies]
# The snapshot example: the lock screen rendered to a PNG for review.
png = "0.17"

[lints]
workspace = true
