[package]
name = "alpymist-settings"
description = "Every Alpymist setting, once: what it is, where it lives, how it changes. Behind the alpymist command, the settings app and the popups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The release channel and the keyboard layouts.
alpymist-core = { workspace = true }
# ai-usage.toml and the providers installed, without the bar.
alpymist-ai-usage = { workspace = true }
# clipboard.toml, and the history's own limits.
alpymist-clipboard = { workspace = true }
# displays.toml: what a closed lid does, kept beside the layouts.
alpymist-displays = { workspace = true }
# power.toml, the power modes and the charge limit, without the popup.
alpymist-power = { workspace = true }
alpymist-theme = { workspace = true }
# screensaver.toml and the idle watch's reload, without the picture.
alpymist-screensaver = { workspace = true }
# iwd, without the popup.
alpymist-wifi = { workspace = true }
# Who is running this, asked of the kernel: /proc is not mounted in the
# installer's chroot, where `alpymist guest on` runs as root.
rustix = { workspace = true, features = ["process"] }
serde_json = { workspace = true }
toml = { workspace = true, features = ["display"] }

[lints]
workspace = true
