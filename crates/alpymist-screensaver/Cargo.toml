[package]
name = "alpymist-screensaver"
description = "Alpymist screensavers: what a screensaver program is built on, what one says about itself, and the idle watch that runs them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["saver"]
# Putting a picture on the screen, and the launcher that does it. Without it
# the crate is the definitions, the values and the idle watch's argument list —
# what alpymist-settings needs, with no Wayland and no Denise behind it.
saver = [
    "dep:alpymist-ui",
    "dep:alpymist-widget",
    "dep:denise",
    "dep:denise-render",
]

[[bin]]
name = "alpymist-screensaver"
path = "src/main.rs"
required-features = ["saver"]

[dependencies]
# The palette the shared backdrop colour comes from.
alpymist-ui = { workspace = true, features = ["render"], optional = true }
# The layer surface, its one-at-a-time socket, and the input that dismisses it.
alpymist-widget = { workspace = true, optional = true }
denise = { workspace = true, optional = true }
denise-render = { workspace = true, optional = true }
serde = { workspace = true }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[lints]
workspace = true
