[package]
name = "alpymist-install"
description = "The Alpymist installer: a graphical wizard that runs before any desktop exists."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "alpymist_install"
path = "src/lib.rs"

[[bin]]
name = "alpymist-install"
path = "src/main.rs"

[dependencies]
alpymist-core = { workspace = true }
alpymist-hwprobe = { workspace = true }
alpymist-ui = { workspace = true, features = ["render"] }
# iwd over D-Bus, shared with the desktop's Wi-Fi popup; without its popup.
alpymist-wifi = { workspace = true }
denise = { workspace = true }
denise-render = { workspace = true }
denise-ui = { workspace = true }
denise-layout = { workspace = true }
denise-winit = { workspace = true, optional = true }
denise-drm = { workspace = true, optional = true }
denise-evdev = { workspace = true, optional = true }
signal-hook = { version = "0.3", optional = true }

[features]
default = ["winit"]
winit = ["dep:denise-winit"]
# The real target: KMS plus evdev, no compositor and no window system.
drm = ["alpymist-ui/drm", "dep:denise-drm", "dep:denise-evdev", "dep:signal-hook"]

[dev-dependencies]
png = "0.17"

[lints]
workspace = true
