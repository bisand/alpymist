[package]
name = "alpymist-menu"
description = "The Alpymist menu: a searchable, configurable launcher and system menu, drawn with Denise on a Wayland layer surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Desktop entries, read as Settings and `alpymist autostart` read them.
alpymist-core = { workspace = true }
# The clipboard picker's entries, and what pinning and forgetting say.
alpymist-clipboard = { workspace = true }
# The colours and fonts every hand-drawn Alpymist window starts from.
alpymist-theme = { workspace = true }
denise = { workspace = true }
denise-render = { workspace = true }
denise-text = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

# The window is a wlr layer surface over wl_shm: no GPU context to create and no
# toolkit to start, which is most of why it is on screen within a frame or two.
# Linux only, so the logic and the offscreen preview still build on a Mac.
[target.'cfg(target_os = "linux")'.dependencies]
alpymist-wayland = { workspace = true }

[dev-dependencies]
png = { workspace = true }

[lints]
workspace = true
