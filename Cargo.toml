[workspace]
resolver = "3"
members = [
    "crates/alpymist-core",
    "crates/alpymist-glesprobe",
    "crates/alpymist-hwprobe",
    "crates/alpymistctl",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bisand/alpymist"

[workspace.dependencies]
alpymist-core = { path = "crates/alpymist-core" }
alpymist-glesprobe = { path = "crates/alpymist-glesprobe" }
alpymist-hwprobe = { path = "crates/alpymist-hwprobe" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
