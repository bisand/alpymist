[workspace]
resolver = "3"
members = [
    "crates/alpymist",
    "crates/alpymist-about",
    "crates/alpymist-ai-usage",
    "crates/alpymist-auth",
    "crates/alpymist-clipboard",
    "crates/alpymist-core",
    "crates/alpymist-dbus",
    "crates/alpymist-displays",
    "crates/alpymist-fingerprint",
    "crates/alpymist-greeter",
    "crates/alpymist-glesprobe",
    "crates/alpymist-install",
    "crates/alpymist-lock",
    "crates/alpymist-menu",
    "crates/alpymist-overview",
    "crates/alpymist-pam",
    "crates/alpymist-power",
    "crates/alpymist-saver-mountains",
    "crates/alpymist-saver-starfield",
    "crates/alpymist-screensaver",
    "crates/alpymist-settings",
    "crates/alpymist-settings-app",
    "crates/alpymist-splash",
    "crates/alpymist-store",
    "crates/alpymist-theme",
    "crates/alpymist-thunderbolt",
    "crates/alpymist-ui",
    "crates/alpymist-wallpaper",
    "crates/alpymist-watchdog",
    "crates/alpymist-wayland",
    "crates/alpymist-widget",
    "crates/alpymist-wifi",
    "crates/alpymist-hwprobe",
    "xtask",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"  # DeniseUI requires it
license = "MIT OR Apache-2.0"
repository = "https://github.com/bisand/alpymist"

[workspace.dependencies]
alpymist-about = { path = "crates/alpymist-about" }
alpymist-ai-usage = { path = "crates/alpymist-ai-usage", default-features = false }
alpymist-auth = { path = "crates/alpymist-auth" }
alpymist-clipboard = { path = "crates/alpymist-clipboard" }
alpymist-core = { path = "crates/alpymist-core" }
alpymist-dbus = { path = "crates/alpymist-dbus" }
alpymist-displays = { path = "crates/alpymist-displays" }
alpymist-glesprobe = { path = "crates/alpymist-glesprobe" }
alpymist-greeter = { path = "crates/alpymist-greeter", default-features = false }
alpymist-hwprobe = { path = "crates/alpymist-hwprobe" }
alpymist-pam = { path = "crates/alpymist-pam" }
alpymist-power = { path = "crates/alpymist-power", default-features = false }
alpymist-saver-mountains = { path = "crates/alpymist-saver-mountains" }
alpymist-saver-starfield = { path = "crates/alpymist-saver-starfield" }
alpymist-screensaver = { path = "crates/alpymist-screensaver", default-features = false }
alpymist-settings = { path = "crates/alpymist-settings" }
alpymist-theme = { path = "crates/alpymist-theme" }
alpymist-ui = { path = "crates/alpymist-ui" }
alpymist-watchdog = { path = "crates/alpymist-watchdog" }
alpymist-wayland = { path = "crates/alpymist-wayland" }
alpymist-widget = { path = "crates/alpymist-widget" }
alpymist-wifi = { path = "crates/alpymist-wifi", default-features = false }
# Every third-party crate the workspace uses is declared here, once, and
# named by `workspace = true` where it is used: `cargo xtask deps` holds the
# members to that, and to the list in xtask/src/deps.rs (ADR 0023).
clap = { version = "4", features = ["derive"] }
# DeniseUI: direct rendering to DRM/KMS or the framebuffer, no compositor.
# "0.31" accepts 0.31.x, so patch releases arrive via `cargo update`.
denise = "0.31"
denise-ui = "0.31"
denise-render = "0.31"
denise-text = { version = "0.31", features = ["truetype"] }
denise-drm = "0.31"
denise-evdev = "0.31"
denise-layout = "0.31"
denise-fbdev = "0.31"
denise-winit = "0.31"
# What is not ours. Each is on the list in xtask/src/deps.rs, with its reason.
bytemuck = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
libloading = "0.8"
png = "0.18"
quick-xml = "0.41"
rustix = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8", default-features = false }
zeroize = "1"
zune-core = "0.5"
zune-jpeg = "0.5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The menu is judged on how soon it is on screen and how quickly it follows a
# keystroke, and nearly all of that time is spent rasterising glyphs. Size is
# the wrong trade there; everything else keeps it.
[profile.release.package.alpymist-menu]
opt-level = 3
# The store searches some thirty thousand entries at every keystroke.
[profile.release.package.alpymist-store]
opt-level = 3
[profile.release.package.quick-xml]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.denise-render]
opt-level = 3
[profile.release.package.denise-text]
opt-level = 3
