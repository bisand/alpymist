# greetd configuration for the Alpymist desktop: Hyprland.
# The installer selects this file through cfgfile in /etc/conf.d/greetd.

[general]
# Our PAM service, which sets XDG_RUNTIME_DIR; see alpymist-greetd.pam.
service = "alpymist-greetd"

[terminal]
# Away from the text consoles on 1-6, so a getty never fights the greeter.
vt = 7

[default_session]
# `alpymist session` writes the files the desktop reads from Settings, then
# becomes the compositor (ADR 0007). It starts the session bus itself, so that
# the bus and everything it starts write to the session log rather than to
# this console, where it showed between the login screen and the desktop.
command = "alpymist-greeter --cmd 'alpymist session hyprland'"
user = "greetd"
# The login screen's own PAM service: the same, without the keyring a login
# gets. See alpymist-greeter.pam.
service = "alpymist-greeter"
