# Alpymist: Hyprland.
#
# Yours to change: the installer copied this into your home. Keys match the
# other Alpymist desktops, so moving between machines costs nothing.

monitor = , preferred, auto, 1

# A cursor theme of our own: without one Hyprland draws its fallback pointer.
env = XCURSOR_THEME,Breeze_Light
env = XCURSOR_SIZE,24

$terminal = ghostty
$launcher = fuzzel
$wallpaper = /usr/share/backgrounds/alpymist/alpymist.png

# The installer records the keyboard layout in /etc/alpymist/session.env, and
# the login applies it to the session's environment. Hyprland does not read it
# from there on its own, so hand it over once started.
exec-once = sh -c '[ -n "$XKB_DEFAULT_LAYOUT" ] && hyprctl keyword input:kb_layout "$XKB_DEFAULT_LAYOUT" && hyprctl keyword input:kb_variant "$XKB_DEFAULT_VARIANT"'
exec-once = swaybg -m fill -i $wallpaper
# Sound before the bar: its volume module retries a missing audio server until
# it runs out of file descriptors and takes the whole bar down with it.
exec-once = hyprctl setcursor Breeze_Light 24
exec-once = /usr/libexec/pipewire-launcher
exec-once = sleep 1 && waybar -c ~/.config/waybar/hyprland.jsonc -s ~/.config/waybar/style.css
exec-once = mako

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgb(7fb8d9)
    col.inactive_border = rgb(3a4c63)
    layout = dwindle
}

decoration {
    rounding = 8
    # Blur and shadows are what make a slow machine feel slow; the mist in the
    # wallpaper does the atmosphere instead.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = mist, 0.2, 0.9, 0.3, 1.0
    animation = windows, 1, 4, mist, popin 90%
    animation = fade, 1, 4, mist
    animation = workspaces, 1, 4, mist, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

input {
    follow_mouse = 1
}

bind = SUPER, Return, exec, $terminal
bind = SUPER, Q, exec, $terminal
bind = SUPER, Space, exec, $launcher
bind = SUPER, W, killactive
bind = SUPER, F, fullscreen
bind = SUPER, V, togglefloating
bind = SUPER, L, exec, swaylock -f -c 0b121e
bind = SUPER SHIFT, E, exit
bind = , Print, exec, sh -c 'grim -g "$(slurp)" "$HOME/screenshot-$(date +%Y%m%d-%H%M%S).png"'

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 9, movetoworkspace, 9

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
