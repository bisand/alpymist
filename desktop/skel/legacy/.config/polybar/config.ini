; Alpymist: the top bar on the X11 desktop, matching Waybar on the others.

[colors]
background = #e00b121e
foreground = #eaf0f6
dim = #9aabbd
accent = #7fb8d9
line = #3a4c63

[bar/alpymist]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
border-bottom-size = 1
border-bottom-color = ${colors.line}
font-0 = Fira Mono:size=10;2
padding-right = 1
module-margin = 1
modules-left = alpymist xworkspaces
modules-center = date
modules-right = cpu memory
tray-position = right
cursor-click = pointer

[module/alpymist]
type = custom/text
format = alpymist
format-foreground = ${colors.accent}
format-padding = 2
click-left = rofi -show drun

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.foreground}
label-active-underline = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.dim}
label-occupied-padding = 1
label-empty =

[module/date]
type = internal/date
interval = 5
date = %a %d %b  %H:%M

[module/cpu]
type = internal/cpu
interval = 5
label = cpu %percentage%%
format-foreground = ${colors.dim}

[module/memory]
type = internal/memory
interval = 10
label = mem %percentage_used%%
format-foreground = ${colors.dim}
