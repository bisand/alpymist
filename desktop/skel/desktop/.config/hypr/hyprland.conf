# Alpymist: Hyprland.
#
# Yours to change: the installer copied this into your home. Keys match the
# other Alpymist desktops, so moving between machines costs nothing.

monitor = , preferred, auto, 1

# A cursor theme of our own: without one Hyprland draws its fallback pointer.
env = XCURSOR_THEME,Breeze_Light
env = XCURSOR_SIZE,24
# squint edits files here: what git, the menu's Config entries and anything
# else that asks $VISUAL open. $EDITOR stays unset, so a terminal outside the
# desktop (a TTY, SSH) keeps nano.
env = VISUAL,squint

# The terminal and the browser are the ones chosen in Settings › Default
# applications: foot and LibreWolf until others are.
$terminal = alpymist open terminal
$launcher = alpymist-menu apps
$menu = alpymist-menu
$browser = alpymist open browser

# The keyboard layout chosen at install. Hyprland ignores the XKB_DEFAULT_*
# variables other desktops read, and a layout set with hyprctl at login did not
# survive a configuration reload; a sourced file does.
source = /etc/alpymist/hyprland-keyboard.conf

# What programs may do to the desktop — see the screen, make keyboards, load
# plugins — and Ctrl+Alt+Delete, which says whether a password prompt is
# really Alpymist's. From the package, so it stays current; take this line out
# and none of it applies.
source = /usr/share/alpymist/hyprland-security.conf

# Services D-Bus starts on demand, the portals among them, get the environment
# handed over here. Without XDG_CURRENT_DESKTOP the portal ignores its Hyprland
# configuration, and Flatpak apps cannot open a file dialog.
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE
# The wallpaper chosen in Settings > Appearance.
exec-once = alpymist wallpaper
# Sound before the bar: its volume module retries a missing audio server until
# it runs out of file descriptors and takes the whole bar down with it.
exec-once = hyprctl setcursor Breeze_Light 24
exec-once = /usr/libexec/pipewire-launcher
exec-once = sleep 1 && waybar -c ~/.config/waybar/hyprland.jsonc -s ~/.config/waybar/style.css
exec-once = mako
# The screensaver and the screen turning off, on the timings in Setup >
# Screensaver. This starts the watch; it decides nothing itself, and running it
# again — as Settings does after a change — restarts the watch with the new
# times rather than starting a second one.
exec-once = alpymist-screensaver idle
# Flathub, for this account: Flatpak installs per user, since without elogind
# polkit never counts the session as active and would ask every install for a
# password nobody is there to type. The file ships with the desktop, so this
# needs no network, and does nothing once the remote is there.
exec-once = flatpak remote-add --user --if-not-exists flathub /usr/share/alpymist/flathub.flatpakrepo

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    # The border colours are the theme's, from Settings › Appearance, in the
    # settings.conf sourced above. Set col.active_border here to keep your own.
    layout = dwindle
}

decoration {
    rounding = 8
    # Blur and shadows are what make a slow machine feel slow; the wallpaper
    # does the atmosphere instead.
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = mist, 0.2, 0.9, 0.3, 1.0
    animation = windows, 1, 4, mist, popin 90%
    animation = fade, 1, 4, mist
    animation = workspaces, 1, 4, mist, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

input {
    follow_mouse = 1
}

# The menu and the Wi-Fi, power and AI usage popups appear the instant they are drawn:
# an animation on any of them only stands between the click or keypress and
# what follows.
layerrule = match:namespace alpymist-menu, no_anim on
layerrule = match:namespace alpymist-wifi, no_anim on
layerrule = match:namespace alpymist-power, no_anim on
layerrule = match:namespace alpymist-ai-usage, no_anim on
# The screensaver fades in instead: it is the one surface here that should not
# arrive abruptly, and it is only ever shown to an empty room.
layerrule = match:namespace alpymist-screensaver, animation fade

# The lid and the power button. Nothing else is listening for them — there is
# no elogind — so they go to alpymist-power, which does what its popup (Setup ›
# Power, or a click on the battery) was set to: suspend, lock, show the power
# menu. bindl, so they work on the lock screen too.
bindl = , switch:on:Lid Switch, exec, alpymist-power lid
bindl = , XF86PowerOff, exec, alpymist-power button
bindl = , XF86Sleep, exec, alpymist-power suspend

bind = SUPER, Return, exec, $terminal
bind = SUPER, Q, exec, $terminal
# Space opens the whole menu, as the mark in the top bar does, and its search
# finds applications too; Alt+Space opens straight at the applications, Escape
# the power menu. Each key closes the menu again when it is already open.
bind = SUPER, Space, exec, $menu
bind = SUPER ALT, Space, exec, $launcher
bind = SUPER, Escape, exec, $menu system
bind = SUPER, B, exec, $browser
bind = SUPER SHIFT, Return, exec, $browser
bind = SUPER, E, exec, alpymist open files
bind = SUPER SHIFT, E, exec, alpymist open editor
bind = SUPER, W, killactive
bind = SUPER, F, fullscreen
# Copy, cut and paste in any window: terminals get Ctrl+Shift+C/V, everything
# else Ctrl+C/X/V, and a terminal, with nothing to cut, is sent nothing for
# Super+X. Super+Shift+V is the history, when Settings › Clipboard keeps one.
bind = SUPER, C, exec, alpymist clipboard copy
bind = SUPER, X, exec, alpymist clipboard cut
bind = SUPER, V, exec, alpymist clipboard paste
bind = SUPER SHIFT, V, exec, alpymist-menu clipboard
bind = SUPER SHIFT, F, togglefloating
bind = SUPER, L, exec, alpymist-lock
# A region, saved to a file and put on the clipboard too.
bind = , Print, exec, sh -c 'f="$HOME/screenshot-$(date +%Y%m%d-%H%M%S).png"; grim -g "$(slurp)" "$f" && wl-copy --type image/png < "$f"'

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
# With Shift the window moves that way among the others, and keeps the focus.
# From the edge of a screen it goes on to the screen on that side, onto the
# workspace that screen is showing. Super+Alt and an arrow goes straight
# there, in /usr/share/alpymist/hyprland-windows.conf.
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# Each screen has its own workspaces 1 to 9 (Settings › Displays): Super+N
# goes to the one on the screen the pointer is on, and Super+Shift+N takes the
# window there.
bind = SUPER, 1, exec, alpymist displays workspace 1
bind = SUPER SHIFT, 1, exec, alpymist displays move 1
bind = SUPER, 2, exec, alpymist displays workspace 2
bind = SUPER SHIFT, 2, exec, alpymist displays move 2
bind = SUPER, 3, exec, alpymist displays workspace 3
bind = SUPER SHIFT, 3, exec, alpymist displays move 3
bind = SUPER, 4, exec, alpymist displays workspace 4
bind = SUPER SHIFT, 4, exec, alpymist displays move 4
bind = SUPER, 5, exec, alpymist displays workspace 5
bind = SUPER SHIFT, 5, exec, alpymist displays move 5
bind = SUPER, 6, exec, alpymist displays workspace 6
bind = SUPER SHIFT, 6, exec, alpymist displays move 6
bind = SUPER, 7, exec, alpymist displays workspace 7
bind = SUPER SHIFT, 7, exec, alpymist displays move 7
bind = SUPER, 8, exec, alpymist displays workspace 8
bind = SUPER SHIFT, 8, exec, alpymist displays move 8
bind = SUPER, 9, exec, alpymist displays workspace 9
bind = SUPER SHIFT, 9, exec, alpymist displays move 9
# Every workspace of the screen the pointer is on, side by side: click one to
# go there, or press the key again.
bind = SUPER, Tab, exec, alpymist displays overview

# Moving and resizing with the mouse, tiled or floating. Resizing by a
# window's edge, by Super+Ctrl and the arrows, and Super+J to turn a split,
# are the package's, in /usr/share/alpymist/hyprland-windows.conf.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
