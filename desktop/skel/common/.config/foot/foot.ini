# Alpymist: foot, the terminal on the Wayland desktops.
[main]
# FiraCode Nerd Font carries the prompt's icons itself. With them from a
# fallback, fontconfig reached DejaVu Sans first, which fills the same code
# points with accented Greek.
font=FiraCode Nerd Font:size=11
pad=10x8

[colors-dark]
background=0b121e
foreground=eaf0f6
regular0=070c14
regular1=d98f7f
regular2=9fcf9f
regular3=d9a07f
regular4=7fb8d9
regular5=b79fd9
regular6=afc2d6
regular7=9aabbd
bright0=3a4c63
bright1=e6a89a
bright2=b8e0b8
bright3=e6bb9a
bright4=a3cde6
bright5=cbb6e6
bright6=d0dde9
bright7=eaf0f6
