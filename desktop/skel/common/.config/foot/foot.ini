# Alpymist: foot, the terminal on the Wayland desktops.
[main]
# The theme's colours, light and dark, from Settings › Appearance. First, so
# anything set below wins over it.
include=~/.config/alpymist/foot/theme.ini
# FiraCode Nerd Font carries the prompt's icons itself. With them from a
# fallback, fontconfig reached DejaVu Sans first, which fills the same code
# points with accented Greek.
font=FiraCode Nerd Font:size=11
pad=10x8
