# The mountains screensaver, as Settings and the launcher read it.
#
# Anything that ships a file like this, and the program it names, becomes a
# screensaver Alpymist offers — no rebuild, and nothing in Alpymist has to know
# it exists. Settings renders its page from the settings declared here, and the
# program reads the same file to know what they default to, so the page and the
# program cannot disagree.

name = "Mountains"
description = "The ranges from the desktop wallpaper, travelling past with the mist moving through them."
exec = "alpymist-saver-mountains"
icon = "󰔎"

[[setting]]
key = "block"
title = "How chunky the picture is"
description = "Physical pixels to one drawn pixel. One is no pixelation at all."
keywords = ["pixels", "pixelated", "resolution", "blocks"]
kind = "number"
min = 1
max = 16
step = 1
unit = "px"
default = 6

[[setting]]
key = "mist"
title = "How much mist"
description = "Thicker mist hides more of the ranges behind it."
keywords = ["fog", "haze", "cloud"]
kind = "number"
min = 0
max = 200
step = 10
unit = "%"
default = 100

[[setting]]
key = "speed"
title = "How fast the ranges travel"
description = "As a percentage of its usual pace. The nearest range travels fastest and every range behind it is close to twice as slow again — nine to one from the front of the picture to the back, which is what gives it depth rather than flatness."
keywords = ["speed", "scroll", "wind", "slow", "fast", "parallax"]
kind = "number"
min = 0
max = 300
step = 25
unit = "%"
default = 100

[[setting]]
key = "fps"
title = "How smoothly it scrolls"
description = "Frames a second. The ranges travel in a straight line, so fewer frames read as the skyline jumping rather than as slowness — and every frame costs a little battery."
keywords = ["smooth", "frames", "fps", "battery", "judder"]
kind = "number"
min = 8
max = 30
step = 1
unit = "fps"
default = 12

[[setting]]
key = "aircraft"
title = "An aircraft crossing"
description = "An aeroplane comes in from the distance and goes back out again, with its navigation lights on and its strobe going. It passes behind the mountains."
keywords = ["plane", "aeroplane", "aircraft", "lights", "sky"]
kind = "switch"
default = true

[[setting]]
key = "balloon"
title = "A balloon, now and then"
description = "Every few minutes a hot-air balloon drifts through, with its burner flaring. It is the shape the Commodore 64 manual taught everybody to draw."
keywords = ["balloon", "c64", "commodore", "sprite", "retro"]
kind = "switch"
default = true
