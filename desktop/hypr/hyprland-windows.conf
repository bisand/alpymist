# Alpymist: how windows behave. Which are dialogs rather than somebody's work,
# floating in the middle of the screen over whatever is tiled, and how a
# window is resized. Sourced by hyprland-security.conf, which every account's
# hyprland.conf sources; shipped by the package, so an upgrade keeps it
# current. A rule of your own in hyprland.conf comes after these, and wins.

# Settings: opened, changed and closed again.
windowrule = match:class ^(alpymist-settings)$, float on, center on, size 960 680

# A terminal opened for one task: a vendor's installer, passwd, a menu entry
# that waits to be read. alpymist-core names its window for this, where the
# terminal chosen in Settings takes a name: foot, kitty, Alacritty, Ghostty.
windowrule = match:class ^(alpymist-task)$, float on, center on, size 820 520

# Resizing. The edge between two windows can be dragged, as the pointer shows
# when it is over one, and a floating window by any of its edges. Super and
# the right button does the same from anywhere inside a window, in
# hyprland.conf.
general {
    resize_on_border = true
}

# The same from the keyboard: Super+Ctrl and an arrow moves the window's right
# or bottom edge that way, for as long as it is held. Between tiled windows
# that is the split they share; a floating one grows and shrinks.
binde = SUPER CTRL, left, resizeactive, -40 0
binde = SUPER CTRL, right, resizeactive, 40 0
binde = SUPER CTRL, up, resizeactive, 0 -40
binde = SUPER CTRL, down, resizeactive, 0 40

# Side by side becomes over and under, and back: the split this window is in
# is turned.
bind = SUPER, J, layoutmsg, togglesplit

# Hyprland runs every bind a key has. To give one of these keys another job
# in hyprland.conf, take it away first: `unbind = SUPER, J`.
