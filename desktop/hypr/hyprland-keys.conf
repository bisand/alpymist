# Alpymist: the keyboard's control keys. Volume, the microphone, the screen's
# and the keyboard's light, whatever is playing, and the radios. Sourced by
# hyprland-security.conf, which every account's hyprland.conf sources;
# shipped by the package, so an upgrade keeps it current and accounts made
# before it existed have it too.
#
# Every machine gets every line: a key a keyboard does not have is a bind
# never pressed. What each does is `alpymist key`, which says so on screen.
# bindl, so they work on the lock screen too, where turning the sound down
# is wanted most; bindel repeats as well, for as long as the key is held.

bindel = , XF86AudioRaiseVolume, exec, alpymist key volume-up
bindel = , XF86AudioLowerVolume, exec, alpymist key volume-down
bindl = , XF86AudioMute, exec, alpymist key mute
bindl = , XF86AudioMicMute, exec, alpymist key mic-mute

bindel = , XF86MonBrightnessUp, exec, alpymist key brightness-up
bindel = , XF86MonBrightnessDown, exec, alpymist key brightness-down

# A Mac's keyboard has these three; most others light theirs in firmware,
# with a key the system never sees.
bindel = , XF86KbdBrightnessUp, exec, alpymist key keyboard-light-up
bindel = , XF86KbdBrightnessDown, exec, alpymist key keyboard-light-down
bindl = , XF86KbdLightOnOff, exec, alpymist key keyboard-light

bindl = , XF86AudioPlay, exec, alpymist key play-pause
bindl = , XF86AudioPause, exec, alpymist key play-pause
bindl = , XF86AudioNext, exec, alpymist key next
bindl = , XF86AudioPrev, exec, alpymist key previous
bindl = , XF86AudioStop, exec, alpymist key stop

# The radios. The kernel leaves these keys to the session, so without these
# lines a key with an aerial on it does nothing at all.
bindl = , XF86WLAN, exec, alpymist key wifi
bindl = , XF86Bluetooth, exec, alpymist key bluetooth
bindl = , XF86RFKill, exec, alpymist key airplane

# The keys with a picture of something to open. Not on the lock screen.
bind = , XF86Tools, exec, alpymist-settings
bind = , XF86Display, exec, alpymist-settings displays
bind = , XF86Search, exec, alpymist-menu
bind = , XF86HomePage, exec, alpymist open browser
bind = , XF86WWW, exec, alpymist open browser
bind = , XF86Explorer, exec, alpymist open files
bind = , XF86ScreenSaver, exec, alpymist-lock
# A Mac's F3 and F4: every workspace, and the applications.
bind = , XF86LaunchA, exec, alpymist displays overview
bind = , XF86LaunchB, exec, alpymist-menu apps

# Hyprland runs every bind a key has. To give one of these keys another job
# in hyprland.conf, take it away first: `unbind = , XF86AudioPlay`.
