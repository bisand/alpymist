# Alpymist: what programs may do to the desktop, and how to tell a real
# password prompt from a lookalike. Sourced by ~/.config/hypr/hyprland.conf;
# shipped by the package, so an upgrade keeps it current.
#
# Hyprland reads permissions once, when it starts: a change here takes a new
# login. hyprland-guiutils, which would let Hyprland ask about a program it
# has no rule for, is not packaged for Alpine, and without it an unanswered
# question is an allowance. So every permission ends in a rule for everything.

ecosystem {
    enforce_permissions = true
}

# What Settings and `alpymist set` change for this account: the touchpad, the
# mouse and key repeat. `alpymist session hyprland` makes sure the file exists
# before Hyprland starts, since Hyprland refuses a missing one. Set here, after
# the keyboard layout and before anything of your own in hyprland.conf, so a
# line of yours still wins.
source = ~/.config/alpymist/hypr/settings.conf

# Which windows are dialogs, floating in the middle of the screen: Settings,
# and a terminal opened for one task. And how a window is resized: by the
# edge, or with Super+Ctrl and the arrows. Here rather than in hyprland.conf
# so accounts made before it existed have it too, and before anything of your
# own, so a rule of yours still wins.
source = /usr/share/alpymist/hyprland-windows.conf

# The keyboard's control keys: volume, brightness, the keyboard's light, what
# is playing, the radios. Here for the same reason, and before anything of
# your own.
source = /usr/share/alpymist/hyprland-keys.conf

# The screens: the layout remembered for the set connected now, as monitor
# rules matched by make, model and serial, after hyprland.conf's catch-all
# `monitor = , preferred, auto, 1` so they win. `alpymist watchdog`
# rewrites it as screens come and go, and `alpymist session hyprland` makes
# sure it exists first. Change layouts with `alpymist displays`.
source = ~/.config/alpymist/hypr/displays.conf

# What this machine's hardware needs said: on the nouveau driver, that
# Hyprland draws the pointer itself, which is otherwise not seen at all.
# `alpymist session hyprland` writes it at every login from the drivers found
# then, and a line of your own in hyprland.conf still wins.
source = ~/.config/alpymist/hypr/hardware.conf

# Hyprland warns at every login that hyprland-guiutils is missing. Its dialogs
# are the permission questions above, which the rules answer instead, and an
# application-not-responding prompt; none of it is in Alpine, edge included,
# so the warning could only ever be ignored.
misc {
    disable_hyprland_guiutils_check = true
}

# Seeing the screen. grim takes the menu's and the Print key's screenshots;
# the wlroots portal is how Flatpak apps and browsers share a screen, after
# asking. Nothing else may read what is on screen: not a lookalike prompt
# studying the real one, not anything watching what is typed into a window.
permission = /usr/bin/grim, screencopy, allow
permission = /usr/libexec/xdg-desktop-portal-wlr, screencopy, allow
permission = .*, screencopy, deny

# Keyboards made by programs: wtype, and anything else speaking the virtual
# keyboard protocol, could type into the store while polkit still remembers
# a password, or press keys on a prompt. Real keyboards are not named this.
# An on-screen keyboard would need a rule of its own above this one, by
# name: hl-virtual-keyboard-<program>.
permission = hl-virtual-keyboard.*, keyboard, deny

# Plugins run inside Hyprland, able to do anything it can, and `hyprctl
# plugin load` would load one for any program. One is let in, by the file it
# is: hyprexpo, Hyprland's own overview of the workspaces, from Alpine's
# package, which only root can write. Every other stays denied (ADR 0015).
permission = /usr/lib/libhyprexpo.so, plugin, allow
permission = .*, plugin, deny

# The overview, which Super+Tab opens through `alpymist displays overview`:
# the nine workspaces of the screen the pointer is on, three by three. A
# session that began before this file allowed it does not load it, and says
# nothing; the next login does.
plugin = /usr/lib/libhyprexpo.so
plugin {
    hyprexpo {
        columns = 3
        gap_size = 8
    }
}

# Where the cursor is: harmless, and asking would allow it anyway.
permission = .*, cursorpos, allow

# Thunderbolt and USB4 devices: a dock waits, keyboard and network and all,
# until someone at an unlocked desktop allows it, and one allowed always is let
# in again when it comes back (ADR 0012). Started here rather than in
# hyprland.conf so accounts made before it get it too; a second copy, from a
# reload, leaves at once.
exec-once = alpymist-thunderbolt

# The programs that start at login: those packages install to, and those added
# in Settings › Startup, less any switched off there. Here for the same reason
# as the line above. After the bar has had its second, so a program with a
# tray icon finds the tray.
exec-once = sleep 2 && alpymist autostart

# The clipboard history, if Settings › Clipboard keeps one: it starts nothing
# otherwise. Here for the same reason as the lines above.
exec-once = alpymist clipboard start

# The watchdog: what the session keeps an eye on for as long as it lasts, one
# watch a process, each started again if it fails (ADR 0019). `alpymist
# watchdog --list` names them.
#
# Screens coming and going: a dock's, a projector's. Each set of screens gets
# the layout it had last time, and one never seen together is extended to the
# right of the laptop's panel and remembered (ADR 0015).
#
# The bar: started again if Hyprland has stopped telling it of workspaces,
# which the bar does not notice itself.
#
# Here for the same reason as the lines above.
exec-once = alpymist watchdog
# Opening the lid turns the laptop's panel back on; closing it, while another
# screen is on, turns the panel off, through alpymist-power, which
# hyprland.conf binds to the lid closing.
bindl = , switch:off:Lid Switch, exec, alpymist displays apply

# Ctrl+Alt+Delete asks Hyprland which program drew each overlay on screen,
# and Hyprland says, in a notification of its own, whether the password
# prompt is Alpymist's. Programs never see this key: Hyprland takes it first.
bind = CTRL ALT, Delete, exec, /usr/bin/alpymist-auth attention
