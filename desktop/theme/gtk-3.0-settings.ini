# Alpymist: dark GTK 3. Adwaita with the dark preference, not "Adwaita-dark",
# which GTK 3 does not have. A user's ~/.config/gtk-3.0/settings.ini overrides it.
# The colours over Adwaita are each account's ~/.config/gtk-3.0/gtk.css, and the
# icons its ~/.local/share/icons/Alpymist, both written from its theme.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=true
gtk-icon-theme-name=Alpymist
gtk-cursor-theme-name=Breeze_Light
gtk-cursor-theme-size=24
