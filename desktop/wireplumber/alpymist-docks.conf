# Alpymist: a dock's sound comes after the laptop's own.
#
# A dock's audio cannot tell whether anything is plugged into its jack, and
# WirePlumber rates USB audio above a laptop's speakers. So with no device
# chosen, sound went to the dock's empty jack, and nothing was heard. A dock is
# named so by the USB product string its devices carry: ThinkPad, HP and other
# docks are; one that is not named a dock is left as WirePlumber rates it.
#
# This is only what Automatic picks. A device chosen in Settings › Sound, or
# with `wpctl set-default`, is WirePlumber's to remember, through restarts,
# and is used whenever it is connected, the dock's included. Installed by
# alpymist-desktop beside WirePlumber's own files; a fragment of your own in
# ~/.config/wireplumber/wireplumber.conf.d/ is read after it.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\.usb-.*_[Dd]ock.*" }
      { node.name = "~alsa_input\\.usb-.*_[Dd]ock.*" }
    ]
    actions = {
      update-props = {
        # A laptop's speakers are rated about 1000.
        priority.session = 500
        priority.driver = 500
      }
    }
  }
]
