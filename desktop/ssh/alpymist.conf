# Alpymist: a key is given to the session's SSH agent the first time it is
# used, so its passphrase is asked once while logged in rather than on every
# connection. The agent holds it in memory only, forgets it when the screen
# locks, and ends with the session (ADR 0013). A Host block of your own in
# ~/.ssh/config can say otherwise; `AddKeysToAgent confirm` there asks before
# each use as well.
AddKeysToAgent yes
