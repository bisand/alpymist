# Alpymist: which portal answers sandboxed apps (Flatpak). GTK's for file
# dialogs, settings and the rest; wlroots' only for screenshots and screen
# sharing, which is what it does. Hyprland's own portal, which Hyprland's
# default asks for first, is not packaged for Alpine 3.24, and without a
# working FileChooser no Flatpak app can open or save a file.
#
# In /etc/xdg, which the portal reads before the compositor's own in /usr/share.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
