<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Alpymist: when Fira Mono lacks a glyph, look in Symbols Nerd Font before
  anything else. DejaVu Sans fills the same private-use code points Nerd Fonts
  uses for icons with accented Greek, so without this a terminal falling back
  on its own draws the prompt's arrow and clock as "ό".
-->
<fontconfig>
  <alias binding="strong">
    <family>Fira Mono</family>
    <prefer>
      <family>Fira Mono</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Fira Mono</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
