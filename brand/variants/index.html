<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Alpymist logo variants</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 1280px; background: #0b121e; }
    body { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
    div { display: grid; place-items: center; padding: 72px; }
    img { display: block; width: 100%; height: auto; }
  </style>
  <div><img src="alpymist-layered-ridge.svg" alt="Layered ridge" /></div>
  <div><img src="alpymist-halo-mist.svg" alt="Halo and mist" /></div>
  <div><img src="alpymist-open-ridge.svg" alt="Open ridge" /></div>
  <div><img src="alpymist-blue-mist.svg" alt="Blue mist" /></div>
</html>
