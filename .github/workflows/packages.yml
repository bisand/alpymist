name: Packages

# Every Alpymist package for x86_64 and aarch64, for one channel, uploaded as
# packages-<arch> and package-keys-<arch>. Not run on its own: Release calls it
# for stable, with an ISO after it, and Dev for dev on every push to main.
# Publishing is the caller's (ADR 0002, ADR 0006).
on:
  workflow_call:
    inputs:
      channel:
        description: stable or dev; dev stamps each first-party version with its last commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # Native, not emulated: a Rust build under QEMU takes many times
          # as long.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Dev versions come from when each package's sources last changed,
          # which takes the history.
          fetch-depth: ${{ inputs.channel == 'dev' && '0' || '1' }}

      - name: Build the builder container
        run: docker build -t alpymist-builder builder

      # squint is built from a pinned upstream commit. build-packages.sh keeps
      # it here, under a key of its aport and the builder, and builds it again
      # only when that changes. The month is in the cache's name so it is
      # rebuilt at least that often against Alpine's libraries as they are
      # updated. It is not versioned by channel, so both channels share it.
      - name: When the kept packages were built
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: cache
          key: packages-v2-${{ matrix.arch }}-${{ steps.month.outputs.month }}-${{ hashFiles('aports/squint/**', 'builder/**') }}
          restore-keys: packages-v2-${{ matrix.arch }}-${{ steps.month.outputs.month }}-

      - name: Build the packages
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          mkdir -p out cache && chmod 777 out cache
          docker run --rm -v "$PWD":/src -v "$PWD/out":/out -v "$PWD/cache":/cache \
            -e PACKAGE_CACHE=/cache -e CHANNEL \
            alpymist-builder bash /src/ci/build-packages.sh /out/packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: out/packages/${{ matrix.arch }}/*.apk
          if-no-files-found: error
          retention-days: 90

      # The public halves of the throwaway keys the packages are signed with,
      # for the ISO job to trust. Apart from the packages, which
      # `cargo xtask publish` takes as they are: installed systems trust the
      # channel key's index, not these.
      - uses: actions/upload-artifact@v7
        with:
          name: package-keys-${{ matrix.arch }}
          path: out/packages/${{ matrix.arch }}/keys/*.rsa.pub
          if-no-files-found: error
          retention-days: 90
