name: Packages

# Every Alpymist package for x86_64 and aarch64, for one channel, uploaded as
# packages-<arch> and package-keys-<arch>. Not run on its own: Release calls it
# for stable, with an ISO after it, and Dev for dev on every push to main.
# Publishing is the caller's (ADR 0002, ADR 0006).
#
# Every package is built as <the workspace version>-r<this run's number>, so
# nothing is versioned by hand and a rebuild never lands on a version already
# published (ADR 0008). Reusable workflows share the caller's run context, so
# the number is Release's or Dev's, each counting on its own.
on:
  workflow_call:
    inputs:
      channel:
        description: stable or dev; dev stamps each first-party version with its last commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # Native, not emulated: a Rust build under QEMU takes many times
          # as long.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Dev versions come from when each package's sources last changed,
          # which takes the history.
          fetch-depth: ${{ inputs.channel == 'dev' && '0' || '1' }}

      - name: Build the builder container
        run: docker build -t alpymist-builder builder

      # squint and validity-fprintd are built from pinned upstream releases.
      # build-packages.sh keeps them here, under a key of their aports and the
      # builder, and builds one again only when that changes. The month is in the cache's name so it is
      # rebuilt at least that often against Alpine's libraries as they are
      # updated. It is not versioned by channel, so both channels share it.
      - name: When the kept packages were built
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: cache
          key: packages-v2-${{ matrix.arch }}-${{ steps.month.outputs.month }}-${{ hashFiles('aports/squint/**', 'aports/validity-fprintd/**', 'builder/**') }}
          restore-keys: packages-v2-${{ matrix.arch }}-${{ steps.month.outputs.month }}-

      # The dev channel keeps what cargo downloaded and compiled of other
      # people's crates from one run to the next: some 280 of them, the same
      # every time, and most of what a dev build spent its minutes on. The
      # workspace's own crates are compiled every run regardless, since each
      # package builds from a fresh copy of the tree.
      #
      # The key is everything a compiled dependency depends on: the compiler,
      # the lockfile and the builder. There are no restore-keys, on purpose: a
      # change in any of them is a build from nothing, saved under the new key,
      # so nothing compiled for another lockfile or compiler is ever carried
      # along. Release does not use it at all: what stable ships is compiled
      # from source in that run (ADR 0002).
      - name: Which compiler the builder has
        if: inputs.channel == 'dev'
        id: rustc
        run: echo "version=$(docker run --rm alpymist-builder rustc --version | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        if: inputs.channel == 'dev'
        with:
          # Outside the checkout, which every package's build copies whole.
          path: ~/alpymist-cargo
          key: cargo-dev-v2-${{ matrix.arch }}-${{ steps.rustc.outputs.version }}-${{ hashFiles('Cargo.lock', 'builder/**') }}

      - name: Build the packages
        env:
          BUILD: ${{ github.run_number }}
          CHANNEL: ${{ inputs.channel }}
          # Where cargo keeps things between runs, inside the container; empty
          # for stable, which keeps nothing.
          CARGO_KEPT: ${{ inputs.channel == 'dev' && '/cargo' || '' }}
        run: |
          # The cache action restores as the runner, and the container builds
          # as its own user: without this, replacing a kept package fails on
          # the files an earlier run left behind.
          mkdir -p out cache ~/alpymist-cargo && chmod 777 out cache ~/alpymist-cargo \
            && chmod -R u+rwX,go+rwX cache ~/alpymist-cargo
          docker run --rm -v "$PWD":/src -v "$PWD/out":/out -v "$PWD/cache":/cache \
            -v "$HOME/alpymist-cargo":/cargo \
            -e PACKAGE_CACHE=/cache -e CHANNEL -e BUILD -e CARGO_KEPT \
            alpymist-builder bash /src/ci/build-packages.sh /out/packages
          # For the cache action, which saves as the runner.
          sudo chown -R "$(id -u):$(id -g)" ~/alpymist-cargo

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: out/packages/${{ matrix.arch }}/*.apk
          if-no-files-found: error
          retention-days: 90

      # The public halves of the throwaway keys the packages are signed with,
      # for the ISO job to trust. Apart from the packages, which
      # `cargo xtask publish` takes as they are: installed systems trust the
      # channel key's index, not these.
      - uses: actions/upload-artifact@v7
        with:
          name: package-keys-${{ matrix.arch }}
          path: out/packages/${{ matrix.arch }}/keys/*.rsa.pub
          if-no-files-found: error
          retention-days: 90
