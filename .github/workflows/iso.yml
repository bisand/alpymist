name: ISO

# Building and booting the image takes far longer than the Rust checks, and
# catches a different kind of breakage: a missing package, a silent boot, a
# regressed tier. So it runs nightly when main has moved, and on demand.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: iso
  cancel-in-progress: true

jobs:
  changes:
    name: Anything new since the last image?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A manual run always builds; that is what asking for one means.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/iso.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "${{ github.sha }}" ]; then
            echo "main is still at $last, which already has an image; skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved from ${last:-nothing} to ${{ github.sha }}"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: ISO (x86_64)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # x86_64 is the architecture Alpymist actually targets — old laptops are
      # overwhelmingly x86. Development happens on aarch64 Macs, so this job is
      # what stops the real target from rotting (ADR 0003).
      - uses: dtolnay/rust-toolchain@1.96

      # Ghostty is not in a stable Alpine branch, so we carry a copy of their
      # testing aport. This says when theirs has moved, or when ghostty has
      # reached a stable branch and the backport can go.
      - name: Check the ghostty backport
        run: cargo run -p xtask -- ghostty-check

      - name: Build the builder container
        run: docker build -t alpymist-builder builder

      - name: Build the ISO
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD":/src -v "$PWD/out":/out \
            alpymist-builder bash /src/ci/build-iso.sh x86_64

      # Hosted runners have /dev/kvm but only root may open it. Without it
      # QEMU emulates every instruction and the boot takes minutes. A chmod
      # lasts as long as the runner, which is as long as it needs to; the udev
      # rule usually suggested failed here because /etc/udev/rules is absent.
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm on this runner; the boot will be emulated"
          fi

      # Potato, not Lite: virtio-gpu without virgl gives the guest no hardware
      # GL, so Mesa falls back to llvmpipe and the tier logic correctly refuses
      # to promote it. If this ever reports Full, the software-renderer check
      # has regressed.
      - name: Boot it and assert the reported tier
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86
          cargo run -p xtask -- smoke \
            --iso out/alpymist-0.0.1-x86_64.iso \
            --arch x86_64 \
            --expect-tier Potato \
            --timeout 300

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alpymist-x86_64-iso
          path: out/*.iso
          retention-days: 7
