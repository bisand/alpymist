name: Release

# What a release is made of: every Alpymist package and an ISO, for x86_64 and
# aarch64, built when a GitHub release is published. The ISOs are attached to
# the release, and beside them Solitaire's console program as one file for a
# system that is not Alpymist. The packages are an artifact and nothing more: the repository
# index is signed with a key CI never sees, by `cargo xtask publish --run <id>`
# (ADR 0002), so what this workflow produces is a candidate, not an update.
#
# Run it by hand to try a change before releasing it: the same builds, kept as
# artifacts, with no release to attach them to. An ISO is only needed for a
# release: systems already installed upgrade from the repository, stable or
# dev, whose packages Packages builds without one (ADR 0006).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release named v0.0.4 has to be built from a commit whose packages say
  # 0.0.4, or the ISO attached to it is not the version on the tin (ADR 0008).
  version:
    name: Version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - name: The tag and the workspace agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$TAG" ]; then
            cargo run -q -p xtask -- version --expect "$TAG"
          else
            cargo run -q -p xtask -- version
          fi

  # Solitaire's console program as one static file for each of three
  # processors, for a system that is not Alpymist (ADR 0030). Beside the
  # packages and not of them: nothing installs it, and a release whose game
  # does not build is still a release, so its failing does not fail the run
  # that stable is published from. The files missing from the release is how
  # that shows; the release skill counts them.
  standalone:
    name: Standalone Solitaire
    needs: version
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96
      - name: Build one file for each processor
        run: >
          sh ci/build-standalone.sh out/standalone
          x86_64-unknown-linux-musl
          aarch64-unknown-linux-musl
          armv7-unknown-linux-musleabihf
      # On Ubuntu, which has no musl: that it starts at all is that it is
      # static. The frame it paints in memory is every card decoded and
      # scaled, with no screen needed.
      - name: The x86_64 one runs where nothing of Alpymist is
        run: |
          out/standalone/alpymist-solitaire-console-x86_64 --version
          out/standalone/alpymist-solitaire-console-x86_64 --bench
      - name: None of them asks for a library
        run: |
          for f in x86_64 aarch64 armv7; do
            file "out/standalone/alpymist-solitaire-console-$f" | tee /dev/stderr | grep -Eq "statically linked|static-pie linked"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: alpymist-solitaire-console
          path: out/standalone/*
          if-no-files-found: error
          retention-days: 30
      - name: Attach them to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/standalone/* --clobber

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
    with:
      channel: stable

  iso:
    name: ISO (${{ matrix.arch }})
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 is the architecture Alpymist actually targets — old laptops
          # are overwhelmingly x86 — and the one the boot test runs on.
          - arch: x86_64
            runner: ubuntu-24.04
          # What a Mac runs in a virtual machine.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: out/prebuilt

      - uses: actions/download-artifact@v7
        with:
          name: package-keys-${{ matrix.arch }}
          path: out/prebuilt/keys

      - name: Build the builder container
        run: docker build -t alpymist-builder builder

      # The packages the job before built, not built again: the image is made
      # of exactly the packages this release's run produced.
      - name: Build the ISO
        env:
          # Empty for a run started by hand, which names the image after the
          # version the workspace is at.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p out/iso && chmod 777 out/iso
          docker run --rm -v "$PWD":/src -v "$PWD/out/iso":/out -v "$PWD/out/prebuilt":/prebuilt:ro \
            -e PREBUILT=/prebuilt -e TAG="${TAG#v}" \
            alpymist-builder bash /src/ci/build-iso.sh ${{ matrix.arch }}

      - uses: dtolnay/rust-toolchain@1.96
        if: matrix.arch == 'x86_64'

      # Hosted runners have /dev/kvm but only root may open it. Without it
      # QEMU emulates every instruction and the boot takes minutes. A chmod
      # lasts as long as the runner, which is as long as it needs to; the udev
      # rule usually suggested failed here because /etc/udev/rules is absent.
      - name: Enable KVM
        if: matrix.arch == 'x86_64'
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "no /dev/kvm on this runner; the boot will be emulated"
          fi

      # Slow: virtio-gpu without virgl gives the guest no hardware GL, so Mesa
      # falls back to llvmpipe, on which Hyprland runs, but on the processor.
      # If this ever reports Runs, the software-renderer check has regressed.
      - name: Boot it and assert what it says of Hyprland
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86
          cargo run -p xtask -- smoke \
            --iso out/iso/alpymist-*-x86_64.iso \
            --arch x86_64 \
            --expect-hyprland Slow \
            --timeout 300

      - uses: actions/upload-artifact@v7
        with:
          name: alpymist-${{ matrix.arch }}-iso
          path: out/iso/*.iso*
          if-no-files-found: error
          retention-days: 30

      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/iso/*.iso out/iso/*.iso.sha256 --clobber
