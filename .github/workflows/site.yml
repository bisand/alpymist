name: Site

# alpymist.org: the SvelteKit site in site/, prerendered and published to
# GitHub Pages. The docs pages are read from docs/, so a change to an ADR
# redeploys it too. The package repository is a separate Pages site
# (bisand/alpymist-packages, pkgs.alpymist.org) and is not touched here.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "aports/alpymist-keys/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://alpymist.org
    steps:
      - uses: actions/deploy-pages@v4
