name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to match Alpine 3.24's Rust and rust-toolchain.toml (ADR 0005).
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # alpymist-menu reads keymaps through libxkbcommon; alpymist-lock checks
      # passwords through libpam.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libpam0g-dev
      - run: cargo fmt --all --check
      # Every APKBUILD's pkgver is the workspace version (ADR 0008).
      - run: cargo run -q --locked -p xtask -- version
      # Every crate is from crates.io, and every third-party one a manifest
      # names is on the list in xtask/src/deps.rs (ADR 0023).
      - run: cargo run -q --locked -p xtask -- deps
      - run: cargo clippy --locked --workspace --all-targets --features alpymist-ui/render -- -D warnings
      - run: cargo test --locked --workspace --features alpymist-ui/render
      # What the installer, the splash and the login screen actually ship as.
      # Nothing above compiles them: a workspace build takes each crate's
      # default features, and for these three that is the desktop preview, not
      # the DRM backend the packages are built with. A change to something they
      # share would otherwise be found by the package build, twenty minutes
      # into Dev, which is how it was found once. Linted here too, since clippy
      # above only ever sees the preview.
      - run: cargo clippy --locked --no-default-features --features drm -p alpymist-greeter -p alpymist-install -p alpymist-solitaire-console -p alpymist-splash --all-targets -- -D warnings
      # Each package by itself, with its own features. The packages build
      # their programs a group at a time, and cargo shares features across a
      # group, so a crate that only compiles with a feature a neighbour turns
      # on would build there and here fails (ADR 0006, addendum of
      # 2026-10-04).
      - run: sh ci/build-programs.sh alone
