name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to match Alpine 3.24's Rust and rust-toolchain.toml (ADR 0005).
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # alpymist-menu reads keymaps through libxkbcommon.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features alpymist-ui/render -- -D warnings
      - run: cargo test --workspace --features alpymist-ui/render
