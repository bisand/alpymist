# Power modes, charge limits, suspend, hibernate and power off from the
# desktop, without a password: administrators may run alpymist-power-helper,
# which accepts only those few verbs and writes only fixed files under /sys.
# doas takes the last rule that matches, and this file sorts after
# 20-wheel.conf, so it is the one that applies to the helper.
permit nopass :wheel as root cmd /usr/libexec/alpymist-power-helper
