# Installing, removing and updating Alpine packages from the store, without a
# password: administrators may run alpymist-store-helper, which accepts only
# add, del, upgrade and update, with plain package names from the configured,
# signed repositories, refuses to remove the base system, and logs every run
# to syslog. doas takes the last rule that matches, and this file sorts after
# 20-wheel.conf, so it is the one that applies to the helper. Delete this file
# to have package changes need a terminal and a password again.
permit nopass :wheel as root cmd /usr/libexec/alpymist-store-helper
